name: Build and deploy airos.works
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [source-updated]
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Cache full source histories
        uses: actions/cache@v4
        with:
          path: .cache
          key: github-sources-v1-${{ github.run_id }}
          restore-keys: github-sources-v1-
      - name: Refresh public Git history and downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync.py
      - name: Build and validate
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/build.py
          python3 scripts/check.py
      - name: Save refreshed public snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add data/github.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="airOS website" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Refresh public Git history and downloads [skip ci]"
          # Never overwrite an editor's concurrent push. The generated site is
          # still valid; a later scheduled run can save the updated snapshot.
          git push origin HEAD:main || echo "::warning::Snapshot not saved; remote branch advanced."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
